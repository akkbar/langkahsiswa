services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schoolapp
      POSTGRES_PASSWORD: schoolapp_dev
      POSTGRES_DB: schoolapp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolapp -d schoolapp"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-schoolapp}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-schoolapp_dev_secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://schoolapp:schoolapp_dev@postgres:5432/schoolapp
      REDIS_URL: redis://redis:6379
      PORT: 3000
      STORAGE_PATH: /app/storage
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: schoolapp
    volumes: ["proof_data:/app/storage"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
  website:
    build:
      context: .
      dockerfile: infra/docker/website.Dockerfile
    ports: ["127.0.0.1:5174:80"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
  proof_data:
